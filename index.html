<script>
/* 회원 클릭 → 카톡 회비 문구 · v30 */
(function(){
  var MK='mfm-members-v2', TK='mfm-tx-v2', FK='mfm-fees-v2', CK='mfm-config-v2';
  function load(k,fb){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
  function won(n){ return (Number(n)||0).toLocaleString('ko-KR'); }
  function yOf(d){ return d?new Date(d).getFullYear():new Date().getFullYear(); }
  function mOf(d){ return d?new Date(d).getMonth()+1:1; }
  function defFee(y){ return (y>=2020&&y<=2022)?100000:200000; }
  function feeFor(y,fees){ var f=(fees||[]).find(function(x){return x.year===y;}); return f?f.amount:defFee(y); }
  function reqFor(m,y,fees){
    var base=feeFor(y,fees); if(base===0)return 0;
    if(y<=2020)return 0; if(y>new Date().getFullYear())return 0;
    var jy=yOf(m.joinDate), jm=mOf(m.joinDate);
    if(m.joinDate&&y<jy)return 0;
    if(m.leaveDate&&y>yOf(m.leaveDate))return 0;
    if(m.joinDate&&y===jy&&jm>=7)return Math.round(base/2);
    return base;
  }
  function allocate(m,mtx,fees,upTo){
    var jy=yOf(m.joinDate), startY=Math.max(jy,2011);
    var endY=m.leaveDate?Math.min(upTo,yOf(m.leaveDate)-1):upTo;
    var years=[]; var prior=Number(m.priorArrears||0);
    if(prior>0)years.push({year:'prior',label:'2020까지 이월',required:prior,allocated:0,payments:[],isPrior:true});
    for(var y=startY;y<=endY;y++)years.push({year:y,label:y+'년',required:reqFor(m,y,fees),allocated:0,payments:[]});
    var sorted=mtx.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});
    for(var i=0;i<sorted.length;i++){ var tx=sorted[i], rem=tx.amount;
      for(var j=0;j<years.length;j++){ var yr=years[j]; if(rem<=0)break; if(yr.allocated>=yr.required)continue;
        var give=Math.min(rem,yr.required-yr.allocated); yr.allocated+=give;
        yr.payments.push({txId:tx.id,date:tx.date,full:tx.amount,part:give}); rem-=give; }
      if(rem>0&&years.length){ var last=years[years.length-1];
        last.payments.push({txId:tx.id,date:tx.date,full:tx.amount,part:rem,overflow:true}); last.allocated+=rem; }
    }
    return years;
  }
  function buildText(m){
    var members=load(MK,[]), tx=load(TK,[]), fees=load(FK,[]), cfg=load(CK,{});
    var gname=(cfg&&cfg.groupName)?cfg.groupName:'부천지역세무사회';
    var upTo=Math.max.apply(null,[new Date().getFullYear(),2011].concat((fees||[]).map(function(f){return f.year;})));
    var mtx=tx.filter(function(t){return t.memberId===m.id;});
    var years=allocate(m,mtx,fees,upTo);
    var byTx={}, order=[];
    years.forEach(function(yr){ yr.payments.forEach(function(p){
      if(!byTx[p.txId]){ byTx[p.txId]={date:p.date,full:p.full,parts:[]}; order.push(p.txId); }
      byTx[p.txId].parts.push({label:yr.label,amount:p.part});
    });});
    order.sort(function(a,b){ return new Date(byTx[a].date)-new Date(byTx[b].date); });
    var lines=[];
    lines.push('['+gname+' 회비 안내]');
    lines.push(m.name+' 세무사님, 안녕하세요.');
    lines.push('회비 납입내역을 안내드립니다.');
    lines.push('');
    lines.push('■ 입금해 주신 내역 → 충당 회비');
    if(order.length===0){ lines.push('· 확인된 입금 내역이 없습니다.'); }
    else{ order.forEach(function(id){ var t=byTx[id];
      var seg=t.parts.map(function(p){return p.label+'('+won(p.amount)+')';}).join(' + ');
      lines.push('· '+t.date+' 입금 '+won(t.full)+'원');
      lines.push('   → '+seg+' 충당');
    }); }
    lines.push('');
    var unpaid=years.filter(function(yr){return yr.required>yr.allocated;});
    var total=unpaid.reduce(function(s,yr){return s+(yr.required-yr.allocated);},0);
    if(total>0){
      lines.push('■ 현재 미납: '+unpaid.map(function(yr){return yr.label+'('+won(yr.required-yr.allocated)+')';}).join(' + '));
      lines.push('   = 총 '+won(total)+'원');
    } else {
      lines.push('■ 현재 미납 없이 완납 상태입니다. 감사합니다.');
    }
    lines.push('');
    lines.push('※ 회비는 오래된 연도부터 순서대로 충당되며, 다음 입금분은 이어서 충당됩니다.');
    lines.push('');
    lines.push('***회비 입금 계좌***');
    lines.push('국민은행 365602-04-026961 (김선영(부천지역세무사회))');
    lines.push('※ 세무사님 성함으로 입금하셔야 확인됩니다.');
    lines.push('');
    lines.push('회비 문의: 재무간사 김선영 세무사 (010-7100-3585)');
    return lines.join('\n');
  }
  function findMember(regNo,name){
    var members=load(MK,[]);
    if(regNo&&regNo!=='-'){ var byR=members.find(function(x){return String(x.regNo||'').trim()===regNo;}); if(byR)return byR; }
    return members.find(function(x){return (x.name||'').trim()===name;});
  }
  function showModal(m){
    var text=buildText(m);
    var ov=document.getElementById('kk-ov'); if(ov)ov.remove();
    ov=document.createElement('div'); ov.id='kk-ov';
    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;';
    ov.onclick=function(e){ if(e.target===ov)ov.remove(); };
    var box=document.createElement('div');
    box.style.cssText='background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3);';
    box.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e7eb;padding:14px 16px;"><b style="font-size:15px;">'+m.name+' · 카톡 회비 문구</b><button id="kk-x" style="border:none;background:none;font-size:20px;cursor:pointer;color:#6b7280;">×</button></div>'
      +'<div style="padding:16px;"><textarea id="kk-t" readonly style="width:100%;height:300px;border:1px solid #d1d5db;border-radius:8px;padding:12px;font-size:14px;line-height:1.6;font-family:inherit;resize:vertical;"></textarea>'
      +'<div style="display:flex;gap:8px;margin-top:12px;"><button id="kk-c" style="flex:1;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;">📋 문구 복사</button><button id="kk-close" style="padding:12px 18px;background:#f3f4f6;color:#374151;border:none;border-radius:8px;font-size:15px;cursor:pointer;">닫기</button></div>'
      +'<p style="margin:10px 0 0;font-size:12px;color:#9ca3af;">복사한 뒤 카카오톡에서 해당 회원에게 붙여넣기 하시면 됩니다.</p></div>';
    ov.appendChild(box); document.body.appendChild(ov);
    document.getElementById('kk-t').value=text;
    document.getElementById('kk-x').onclick=function(){ov.remove();};
    document.getElementById('kk-close').onclick=function(){ov.remove();};
    document.getElementById('kk-c').onclick=function(){
      var ta=document.getElementById('kk-t'); ta.select();
      navigator.clipboard.writeText(ta.value).then(function(){
        var b=document.getElementById('kk-c'); b.textContent='✓ 복사됐습니다'; b.style.background='#059669';
        setTimeout(function(){ b.textContent='📋 문구 복사'; b.style.background='#2563eb'; },1500);
      });
    };
  }
  window.cfmShowKakao=showModal;
  window.cfmBuildKakaoText=buildText;
  document.addEventListener('click',function(e){
    var td=e.target.closest&&e.target.closest('td'); if(!td)return;
    if(td.style.left!=='118px')return;
    var tr=td.closest('tr'); if(!tr)return;
    var regNo=(tr.children[1]&&tr.children[1].textContent||'').trim();
    var name=(td.textContent||'').trim();
    var m=findMember(regNo,name); if(m)showModal(m);
  },true);
  setInterval(function(){
    var tds=document.querySelectorAll('td'); for(var i=0;i<tds.length;i++){
      if(tds[i].style.left==='118px'){ tds[i].style.cursor='pointer'; if(!tds[i].title)tds[i].title='클릭하면 카톡 회비 문구가 생성됩니다'; }
    }
  },900);
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* 회원명단 연락처 반영 + 회원조회용 최소자료 전송 · v33 */
(function () {
  var MEMBER_KEY = 'mfm-members-v2';
  var TX_KEY = 'mfm-tx-v2';
  var FEE_KEY = 'mfm-fees-v2';
  var UPLOAD_KEY = 'mfm-upload-v2';
  var pendingRoster = null;
  var PRESET_DEPOSITOR_ALIASES = {
    '이창숙': ['세무법인비펌'],
    '김복곤': ['세무법인성산부천2지점'],
    '박인수': ['드림세무법인부천지점'],
    '심기태': ['세무법인성산부천1지점'],
    '안병선': ['세무법인성산부천3지점', '세무법인성산부천3지'],
    '이영석': ['세무법인세담'],
    '김용삼': ['세무법인스타택스'],
    '정귀수': ['세무법인중산4지점'],
    '황만순': ['세무법인택스원 부천'],
    '박재정': ['세무법인하누리부천제4지점'],
    '노승안': ['세무법인화인부천지점'],
    '신기철': ['정안세무법인', '정안세무법인(신기철'],
    '박승진': ['청록세무법인(부천)'],
    '이기진': ['하늘세무법인부천'],
    '홍정표': ['현대세무법인']
  };

  function digits(value) {
    return String(value == null ? '' : value).replace(/[^0-9]/g, '');
  }

  function readJson(key, fallback) {
    try {
      var value = localStorage.getItem(key);
      return value ? JSON.parse(value) : fallback;
    } catch (e) {
      return fallback;
    }
  }

  function mergePresetDepositorAliases(members) {
    var changed = 0;
    var mergedMembers = (members || []).map(function (member) {
      var presets = PRESET_DEPOSITOR_ALIASES[String(member.name || '').trim()];
      if (!presets || !presets.length) return member;
      var aliases = Array.isArray(member.aliases) ? member.aliases.slice() : [];
      presets.forEach(function (alias) {
        if (aliases.indexOf(alias) === -1) aliases.push(alias);
      });
      if (aliases.length === (Array.isArray(member.aliases) ? member.aliases.length : 0)) return member;
      changed++;
      return Object.assign({}, member, { aliases: aliases });
    });
    return { members: mergedMembers, changed: changed };
  }

  function isCurrentMember(member) {
    if (!member.leaveDate) return true;
    var leave = new Date(member.leaveDate);
    return isNaN(leave.getTime()) || leave > new Date();
  }

  function yearOf(value) {
    return value ? new Date(value).getFullYear() : new Date().getFullYear();
  }

  function monthOf(value) {
    return value ? new Date(value).getMonth() + 1 : 1;
  }

  function defaultFee(year) {
    return year >= 2020 && year <= 2022 ? 100000 : 200000;
  }

  function feeForYear(year, fees) {
    var fee = (fees || []).find(function (item) { return Number(item.year) === year; });
    return fee ? Number(fee.amount || 0) : defaultFee(year);
  }

  function requiredFor(member, year, fees) {
    var base = feeForYear(year, fees);
    if (!base || year <= 2020 || year > new Date().getFullYear()) return 0;
    var joinYear = yearOf(member.joinDate);
    if (member.joinDate && year < joinYear) return 0;
    if (member.leaveDate && year > yearOf(member.leaveDate)) return 0;
    if (member.joinDate && year === joinYear && monthOf(member.joinDate) >= 7) return Math.round(base / 2);
    return base;
  }

  function allocateForLookup(member, memberTransactions, fees, upTo) {
    var startYear = Math.max(yearOf(member.joinDate), 2011);
    var endYear = member.leaveDate ? Math.min(upTo, yearOf(member.leaveDate) - 1) : upTo;
    var years = [];
    var prior = Number(member.priorArrears || 0);
    if (prior > 0) years.push({ year: 'prior', label: '2020년까지 이월', required: prior, allocated: 0, payments: [], isPrior: true });
    for (var year = startYear; year <= endYear; year++) {
      var required = requiredFor(member, year, fees);
      if (required > 0) years.push({ year: year, label: year + '년도', required: required, allocated: 0, payments: [], isPrior: false });
    }
    var sorted = memberTransactions.slice().sort(function (a, b) {
      return (String(a.date || '') + ' ' + String(a.time || '')).localeCompare(String(b.date || '') + ' ' + String(b.time || ''));
    });
    sorted.forEach(function (transaction) {
      var remaining = Number(transaction.amount || 0);
      years.forEach(function (item) {
        if (remaining <= 0 || item.allocated >= item.required) return;
        var applied = Math.min(remaining, item.required - item.allocated);
        item.allocated += applied;
        item.payments.push({
          txId: transaction.id,
          date: String(transaction.date || ''),
          time: String(transaction.time || ''),
          depositorName: String(transaction.depositorName || ''),
          fullAmount: Number(transaction.amount || 0),
          appliedAmount: applied
        });
        remaining -= applied;
      });
    });
    return years.map(function (item) {
      var remaining = Math.max(0, item.required - item.allocated);
      return {
        year: item.year,
        label: item.label,
        required: item.required,
        allocated: Math.min(item.required, item.allocated),
        remaining: remaining,
        status: remaining <= 0 ? 'paid' : item.allocated > 0 ? 'partial' : 'unpaid',
        payments: item.payments
      };
    });
  }

  function makeLookupData() {
    var members = readJson(MEMBER_KEY, []);
    var transactions = readJson(TX_KEY, []);
    var fees = readJson(FEE_KEY, []);
    var uploadMeta = readJson(UPLOAD_KEY, null) || {};
    var maxFeeYear = (fees || []).reduce(function (max, fee) { return Math.max(max, Number(fee.year || 0)); }, 0);
    var upTo = Math.max(new Date().getFullYear(), maxFeeYear, 2011);
    return {
      version: 2,
      generatedAt: new Date().toISOString(),
      bankLastTransactionAt: String(uploadMeta.maxDate || ''),
      bankFileUploadedAt: String(uploadMeta.uploadedAt || ''),
      members: members.filter(isCurrentMember).map(function (member) {
        var phoneDigits = digits(member.phone);
        var memberTransactions = transactions.filter(function (tx) { return tx.memberId === member.id; });
        var years = allocateForLookup(member, memberTransactions, fees, upTo);
        return {
          regNo: String(member.regNo || '').trim(),
          phoneLast4: phoneDigits.length >= 4 ? phoneDigits.slice(-4) : '',
          name: String(member.name || '').trim(),
          totalArrears: years.reduce(function (sum, item) { return sum + Number(item.remaining || 0); }, 0),
          years: years,
          payments: memberTransactions.map(function (tx) {
              return {
                date: String(tx.date || ''),
                time: String(tx.time || ''),
                amount: Number(tx.amount || 0),
                depositorName: String(tx.depositorName || '')
              };
            })
            .sort(function (a, b) {
              return (a.date + ' ' + a.time).localeCompare(b.date + ' ' + b.time);
            })
        };
      }).filter(function (member) {
        return member.regNo && member.phoneLast4;
      })
    };
  }

  function formatAdminDateTime(value) {
    if (!value) return '기록 없음';
    var source = String(value);
    var year, month, day, hour, minute;
    if (/T|Z|[+-]\d\d:\d\d$/.test(source)) {
      var date = new Date(source);
      if (isNaN(date.getTime())) return source;
      year = date.getFullYear(); month = date.getMonth() + 1; day = date.getDate();
      hour = date.getHours(); minute = date.getMinutes();
    } else {
      var text = source.replace('T', ' ').slice(0, 19);
      var match = text.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
      if (!match) return text;
      year = Number(match[1]); month = Number(match[2]); day = Number(match[3]);
      hour = Number(match[4]); minute = Number(match[5]);
    }
    var ampm = hour < 12 ? '오전' : '오후';
    var displayHour = hour % 12 || 12;
    return year + '. ' + month + '. ' + day + '. ' + ampm + ' ' + displayHour + '시' + (minute ? ' ' + minute + '분' : '');
  }

  function applyBankTimeLabels() {
    var uploadMeta = readJson(UPLOAD_KEY, null) || {};
    var spans = document.querySelectorAll('span');
    for (var index = 0; index < spans.length; index++) {
      var labelText = spans[index].textContent || '';
      if (labelText.indexOf('통장 자료 최종일시:') === -1
        && labelText.indexOf('통장파일 업로드 ·') === -1) continue;
      spans[index].innerHTML = '🏦 통장파일 업로드 · <b class="text-gray-800">' + formatAdminDateTime(uploadMeta.uploadedAt) + '</b>'
        + ' <span class="text-gray-400">　통장 마지막 거래 · <b class="text-gray-800">' + formatAdminDateTime(uploadMeta.maxDate) + '</b></span>';
    }
  }

  var originalFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    if (init && String(init.method || '').toUpperCase() === 'POST' && typeof init.body === 'string') {
      try {
        var body = JSON.parse(init.body);
        if (body && body.xlsxBase64 && Object.prototype.hasOwnProperty.call(body, 'token')) {
          body.lookupData = makeLookupData();
          init = Object.assign({}, init, { body: JSON.stringify(body) });
        }
      } catch (e) {}
    }
    return originalFetch(input, init);
  };

  async function parseRosterContacts(file) {
    if (!window.XLSX || !file) return null;
    var workbook = XLSX.read(await file.arrayBuffer(), { cellDates: true });
    var data = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: '' });
    var headerIndex = -1;
    for (var i = 0; i < Math.min(data.length, 15); i++) {
      var headerText = (data[i] || []).map(String).join(' ');
      if ((headerText.indexOf('성명') !== -1 || headerText.indexOf('이름') !== -1) && headerText.indexOf('등록번호') !== -1) {
        headerIndex = i;
        break;
      }
    }
    if (headerIndex < 0) return null;
    var columnCount = Math.max.apply(null, data.slice(Math.max(0, headerIndex - 2), headerIndex + 1).map(function (row) { return (row || []).length; }));
    var headers = [];
    for (var headerColumn = 0; headerColumn < columnCount; headerColumn++) {
      var parts = [];
      for (var headerRow = Math.max(0, headerIndex - 2); headerRow <= headerIndex; headerRow++) {
        var part = String((data[headerRow] || [])[headerColumn] || '').trim();
        if (part && parts.indexOf(part) === -1) parts.push(part);
      }
      headers.push(parts.join(' '));
    }
    function columns(keys) {
      var found = [];
      headers.forEach(function (header, index) {
        if (keys.some(function (key) { return header.indexOf(key) !== -1; })) found.push(index);
      });
      return found;
    }
    function column(keys) { var found = columns(keys); return found.length ? found[0] : -1; }
    var regCol = column(['등록번호']);
    var nameCol = column(['성명', '이름']);
    var mobileCols = columns(['휴대전화', '휴대폰', '핸드폰', '휴대 전화', '휴대 폰']);
    var fallbackPhoneCols = columns(['전화번호', '연락처', '전화 번호']);
    if (!mobileCols.length && !fallbackPhoneCols.length || (regCol < 0 && nameCol < 0)) return null;
    function normalizePhone(value) {
      var phone = String(value == null ? '' : value).trim();
      var numberOnly = phone.replace(/[^0-9]/g, '');
      if (numberOnly.length === 10 && numberOnly.charAt(0) === '1') numberOnly = '0' + numberOnly;
      if (numberOnly.length === 11) return numberOnly.slice(0, 3) + '-' + numberOnly.slice(3, 7) + '-' + numberOnly.slice(7);
      return phone;
    }
    function firstPhone(row, candidates) {
      for (var candidateIndex = 0; candidateIndex < candidates.length; candidateIndex++) {
        var value = normalizePhone(row[candidates[candidateIndex]]);
        if (value) return value;
      }
      return '';
    }
    function cellText(row, index) {
      if (index < 0) return '';
      var value = row[index];
      if (value instanceof Date && !isNaN(value.getTime())) {
        var year = value.getFullYear();
        var month = String(value.getMonth() + 1).padStart(2, '0');
        var day = String(value.getDate()).padStart(2, '0');
        return year + '-' + month + '-' + day;
      }
      return String(value == null ? '' : value).trim();
    }
    function firstCell(row, keys) {
      var matches = columns(keys);
      for (var matchIndex = 0; matchIndex < matches.length; matchIndex++) {
        var value = cellText(row, matches[matchIndex]);
        if (value) return value;
      }
      return '';
    }
    var contacts = [];
    for (var rowIndex = headerIndex + 1; rowIndex < data.length; rowIndex++) {
      var row = data[rowIndex] || [];
      var mobile = firstPhone(row, mobileCols);
      var fallbackPhone = firstPhone(row, fallbackPhoneCols);
      var phone = mobile || fallbackPhone;
      var regNo = regCol >= 0 ? String(row[regCol] || '').trim() : '';
      var name = nameCol >= 0 ? String(row[nameCol] || '').trim() : '';
      var rosterFields = {};
      headers.forEach(function (header, fieldIndex) {
        var label = String(header || '').trim();
        var value = cellText(row, fieldIndex);
        if (!label || !value) return;
        var uniqueLabel = label;
        var suffix = 2;
        while (Object.prototype.hasOwnProperty.call(rosterFields, uniqueLabel)) uniqueLabel = label + ' (' + suffix++ + ')';
        rosterFields[uniqueLabel] = value;
      });
      if (regNo || name) contacts.push({
        regNo: regNo, name: name, phone: phone, mobilePhone: mobile,
        officePhone: firstCell(row, ['전화번호', '전화 번호']),
        fax: firstCell(row, ['팩스번호', '팩스 번호', '팩스']),
        officeAddress: firstCell(row, ['사무소 주소', '사무소주소', '주소']),
        registrationDate: firstCell(row, ['등록일']),
        society: firstCell(row, ['지역세무사회명', '지역세무사회', '지역회']),
        note1: firstCell(row, ['비고1', '비고 1']), note2: firstCell(row, ['비고2', '비고 2']),
        rosterFields: rosterFields,
        phoneSource: mobile ? 'mobile' : fallbackPhone ? 'fallback' : ''
      });
    }
    return contacts;
  }

  document.addEventListener('change', function (event) {
    var input = event.target;
    if (!input || input.tagName !== 'INPUT' || input.type !== 'file' || !input.files || !input.files[0]) return;
    var card = input.closest('.bg-white.rounded-lg.border');
    var title = card ? (card.textContent || '') : '';
    if (title.indexOf('최신 회원명단') === -1) return;
    pendingRoster = parseRosterContacts(input.files[0]);
  }, true);

  document.addEventListener('click', function (event) {
    var button = event.target.closest && event.target.closest('button');
    if (!button || (button.textContent || '').trim() !== '이 명단으로 반영' || !pendingRoster) return;
    var contactsPromise = pendingRoster;
    pendingRoster = null;
    setTimeout(async function () {
      var contacts = await contactsPromise;
      if (!contacts || !contacts.length) return;
      var members = readJson(MEMBER_KEY, []);
      var memberByReg = new Map();
      var memberByName = new Map();
      members.forEach(function (member) {
        var regNo = String(member.regNo || '').trim();
        var name = String(member.name || '').trim();
        if (regNo) memberByReg.set(regNo, member);
        if (name) memberByName.set(name, member);
      });
      var ordered = [];
      var seen = new Set();
      var changed = 0;
      var contactCount = 0;
      var mobileCount = 0;
      contacts.forEach(function (contact) {
        var member = (contact.regNo && memberByReg.get(contact.regNo)) || (contact.name && memberByName.get(contact.name));
        if (!member || seen.has(member.id)) return;
        if (contact.phone) contactCount++;
        if (contact.phoneSource === 'mobile') mobileCount++;
        var rosterUpdate = {
          rosterFields: contact.rosterFields, mobilePhone: contact.mobilePhone,
          officePhone: contact.officePhone, fax: contact.fax,
          officeAddress: contact.officeAddress, registrationDate: contact.registrationDate,
          note1: contact.note1, note2: contact.note2
        };
        if (contact.society) rosterUpdate.society = contact.society;
        if (contact.phone) rosterUpdate.phone = contact.phone;
        var updatedMember = Object.assign({}, member, rosterUpdate);
        if (JSON.stringify(updatedMember) !== JSON.stringify(member)) changed++;
        member = updatedMember;
        ordered.push(member);
        seen.add(member.id);
      });
      members.forEach(function (member) {
        if (!seen.has(member.id)) ordered.push(member);
      });
      var presetResult = mergePresetDepositorAliases(ordered);
      ordered = presetResult.members;
      var orderChanged = ordered.some(function (member, index) { return !members[index] || members[index].id !== member.id; });
      if (!changed && !presetResult.changed && !orderChanged) return;
      localStorage.setItem(MEMBER_KEY, JSON.stringify(ordered));
      alert('회원명단의 엑셀 행 순서와 전체 기본정보를 반영했습니다.'
        + ' 전체 ' + contacts.length + '명 중 연락처 ' + contactCount + '건을 확인했고, 휴대전화 우선 ' + mobileCount + '건을 적용했습니다.'
        + (changed ? ' 회원 기본정보 ' + changed + '건을 갱신했습니다.' : '')
        + (presetResult.changed ? ' 기본 입금자 별칭 ' + presetResult.changed + '명도 함께 반영했습니다.' : ''));
      location.reload();
    }, 900);
  }, true);

  setTimeout(function () {
    var members = readJson(MEMBER_KEY, []);
    if (!members.length) return;
    var presetResult = mergePresetDepositorAliases(members);
    if (!presetResult.changed) return;
    localStorage.setItem(MEMBER_KEY, JSON.stringify(presetResult.members));
    location.reload();
  }, 2500);

  setInterval(applyBankTimeLabels, 800);
})();
</script>
<script>
/* 회원 조회 잠금 관리 · v36 */
(function () {
  var CONFIG_KEY = 'mfm-config-v2';

  function readConfig() {
    try { return JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}'); }
    catch (e) { return {}; }
  }

  async function lockApi(action, extra) {
    var config = readConfig();
    var url = String(config.relayUrl || '').trim();
    var token = String(config.relayToken || '').trim();
    if (!url || !token) throw new Error('회비설정에서 중계 URL과 토큰을 먼저 확인해 주세요.');
    var body = Object.assign({ action: action, token: token }, extra || {});
    var response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    });
    var data = await response.json();
    if (!data || !data.ok) throw new Error((data && data.error) || '요청을 처리하지 못했습니다.');
    return data;
  }

  function formatTime(value) {
    if (!value) return '-';
    var date = new Date(value);
    if (isNaN(date.getTime())) return String(value);
    return date.toLocaleString('ko-KR', { hour12: true });
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
    });
  }

  function createModal() {
    var overlay = document.createElement('div');
    overlay.id = 'lookup-lock-modal';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px';
    overlay.innerHTML = '<section style="width:min(100%,760px);max-height:88vh;overflow:hidden;background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,.24);display:flex;flex-direction:column">'
      + '<header style="display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid #e5e7eb"><div><b style="font-size:17px">회원 조회 잠금 관리</b><div style="margin-top:3px;color:#6b7280;font-size:12px">회원 이름으로 확인하고 잠금을 해제합니다.</div></div><button id="lookup-lock-close" type="button" style="border:0;background:none;font-size:24px;color:#6b7280;cursor:pointer">×</button></header>'
      + '<div style="padding:15px 20px;border-bottom:1px solid #e5e7eb;display:flex;gap:8px;flex-wrap:wrap"><input id="lookup-lock-search" placeholder="회원명 또는 등록번호 검색" style="flex:1;min-width:210px;border:1px solid #d1d5db;border-radius:9px;padding:10px 12px;font-size:14px"><button id="lookup-lock-refresh" type="button" style="border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer">새로고침</button><button id="lookup-lock-unknown" type="button" style="border:1px solid #f59e0b;background:#fffbeb;color:#92400e;border-radius:9px;padding:9px 13px;cursor:pointer">확인 불가 잠금 해제</button><button id="lookup-lock-all" type="button" style="border:1px solid #fca5a5;background:#fff1f2;color:#9f1239;border-radius:9px;padding:9px 13px;cursor:pointer">전체 잠금 해제</button></div>'
      + '<div id="lookup-lock-status" style="padding:10px 20px;color:#64748b;font-size:13px"></div><div id="lookup-lock-list" style="overflow:auto;padding:0 20px 20px"></div></section>';
    document.body.appendChild(overlay);
    return overlay;
  }

  function openLockManager() {
    var overlay = createModal();
    var list = overlay.querySelector('#lookup-lock-list');
    var status = overlay.querySelector('#lookup-lock-status');
    var search = overlay.querySelector('#lookup-lock-search');
    var locks = [];

    function render() {
      var query = search.value.trim().toLowerCase();
      var filtered = locks.filter(function (item) {
        return !query || String(item.memberName || '').toLowerCase().includes(query) || String(item.maskedRegNo || '').toLowerCase().includes(query);
      });
      if (!filtered.length) {
        list.innerHTML = '<div style="padding:30px 10px;text-align:center;color:#94a3b8">조회 잠금 내역이 없습니다.</div>';
        return;
      }
      list.innerHTML = filtered.map(function (item) {
        return '<div style="display:grid;grid-template-columns:minmax(120px,1fr) 100px 170px auto;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px solid #eef2f7">'
          + '<div><b>' + escapeHtml(item.memberName || '회원 확인 불가') + '</b><div style="margin-top:3px;color:#64748b;font-size:12px">' + escapeHtml(item.maskedRegNo || '-') + '</div></div>'
          + '<div style="font-size:13px;color:#9f1239">3회 불일치</div><div style="font-size:12px;color:#64748b">' + escapeHtml(formatTime(item.lockedAt)) + '</div>'
          + '<button class="lookup-lock-release" data-lock-id="' + escapeHtml(item.lockId) + '" type="button" style="border:0;background:#173f72;color:#fff;border-radius:8px;padding:9px 12px;cursor:pointer">잠금 해제</button></div>';
      }).join('');
    }

    async function load() {
      status.textContent = '잠금 내역을 불러오는 중입니다.';
      try {
        var data = await lockApi('listLookupLocks');
        locks = Array.isArray(data.locks) ? data.locks : [];
        status.textContent = '현재 잠금 ' + locks.length + '건';
        render();
      } catch (error) {
        status.textContent = error.message;
        list.innerHTML = '';
      }
    }

    overlay.querySelector('#lookup-lock-close').onclick = function () { overlay.remove(); };
    overlay.onclick = function (event) { if (event.target === overlay) overlay.remove(); };
    search.oninput = render;
    overlay.querySelector('#lookup-lock-refresh').onclick = load;
    list.onclick = async function (event) {
      var button = event.target.closest('.lookup-lock-release');
      if (!button) return;
      button.disabled = true;
      try { await lockApi('unlockLookupLock', { lockId: button.dataset.lockId }); await load(); }
      catch (error) { status.textContent = error.message; button.disabled = false; }
    };
    overlay.querySelector('#lookup-lock-unknown').onclick = async function () {
      if (!confirm('회원 확인이 되지 않은 조회 잠금을 모두 해제할까요?')) return;
      try { await lockApi('unlockUnknownLocks'); await load(); } catch (error) { status.textContent = error.message; }
    };
    overlay.querySelector('#lookup-lock-all').onclick = async function () {
      if (!confirm('모든 회원의 조회 잠금을 해제할까요?')) return;
      try { await lockApi('unlockAllLookupLocks'); await load(); } catch (error) { status.textContent = error.message; }
    };
    load();
  }

  function installButton() {
    if (document.getElementById('lookup-lock-menu')) return;
    var nav = Array.from(document.querySelectorAll('div')).find(function (element) {
      return element.className && String(element.className).includes('overflow-x-auto') && element.textContent.includes('납입현황') && element.textContent.includes('탈회회원');
    });
    if (!nav) return;
    var button = document.createElement('button');
    button.id = 'lookup-lock-menu';
    button.type = 'button';
    button.className = 'flex items-center gap-2 px-4 py-2.5 text-sm font-medium border-b-2 whitespace-nowrap border-transparent text-gray-600 hover:text-gray-900';
    button.innerHTML = '<span aria-hidden="true">🔒</span> 조회 잠금 관리';
    button.onclick = openLockManager;
    nav.appendChild(button);
  }

  setInterval(installButton, 800);
})();
</script>
<script>
/* 회원관리 전체 기본정보 표시 · v42 */
(function () {
  var MEMBER_KEY_FOR_PHONE = 'mfm-members-v2';
  function phoneMembers() {
    try { return JSON.parse(localStorage.getItem(MEMBER_KEY_FOR_PHONE) || '[]'); } catch (error) { return []; }
  }
  function showMemberPhones() {
    var table = Array.from(document.querySelectorAll('table')).find(function (candidate) {
      var head = candidate.querySelector('thead');
      var text = head ? head.textContent : '';
      return text.indexOf('등록번호') !== -1 && text.indexOf('입금자명/별칭') !== -1 && text.indexOf('상태') !== -1;
    });
    if (!table) return;
    var byReg = {};
    phoneMembers().forEach(function (member) {
      var regNo = String(member.regNo || '').trim();
      if (regNo) byReg[regNo] = member;
    });
    var aliasHeader = Array.from(table.querySelectorAll('thead th')).find(function (th) { return th.textContent.indexOf('입금자명/별칭') !== -1; });
    if (aliasHeader) aliasHeader.textContent = '입금자명/별칭 · 회원정보';
    Array.from(table.querySelectorAll('tbody tr')).forEach(function (row) {
      var cells = row.querySelectorAll('td');
      if (cells.length < 3 || cells[2].querySelector('input')) return;
      var regNo = String(cells[0].textContent || '').trim();
      var member = byReg[regNo];
      var phone = member && member.phone ? String(member.phone) : '-';
      var phoneLine = cells[2].querySelector('[data-member-phone]');
      if (!phoneLine) {
        phoneLine = document.createElement('div');
        phoneLine.dataset.memberPhone = '1';
        phoneLine.style.cssText = 'margin-top:4px;color:#475569;font-size:12px;white-space:nowrap';
        cells[2].appendChild(phoneLine);
      }
      phoneLine.textContent = '연락처 · ' + phone;
      var detailButton = cells[2].querySelector('[data-member-detail]');
      if (!detailButton) {
        detailButton = document.createElement('button');
        detailButton.type = 'button';
        detailButton.dataset.memberDetail = '1';
        detailButton.style.cssText = 'margin-top:4px;padding:2px 8px;border:1px solid #cbd5e1;border-radius:5px;color:#334155;background:#fff;font-size:12px';
        cells[2].appendChild(detailButton);
      }
      detailButton.textContent = '회원정보 상세';
      detailButton.onclick = function () { openMemberDetail(member); };
    });
  }
  function openMemberDetail(member) {
    var old = document.getElementById('member-roster-detail-modal');
    if (old) old.remove();
    var fields = member && member.rosterFields ? member.rosterFields : {};
    var entries = Object.keys(fields).map(function (key) { return [key, fields[key]]; });
    if (!entries.length) entries = [
      ['등록번호', member.regNo || '-'], ['성명', member.name || '-'], ['휴대폰번호', member.mobilePhone || member.phone || '-'],
      ['전화번호', member.officePhone || '-'], ['팩스번호', member.fax || '-'], ['사무소 주소', member.officeAddress || '-'],
      ['등록일', member.registrationDate || '-'], ['개업/전입일', member.joinDate || '-'], ['폐업/전출일', member.leaveDate || '-'],
      ['비고1', member.note1 || '-'], ['비고2', member.note2 || '-']
    ];
    var modal = document.createElement('div');
    modal.id = 'member-roster-detail-modal';
    modal.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:24px';
    var panel = document.createElement('div');
    panel.style.cssText = 'width:min(760px,100%);max-height:85vh;overflow:auto;background:white;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)';
    var heading = document.createElement('div');
    heading.style.cssText = 'position:sticky;top:0;background:white;border-bottom:1px solid #e2e8f0;padding:18px 22px;display:flex;justify-content:space-between;align-items:center';
    var title = document.createElement('strong');
    title.style.fontSize = '18px'; title.textContent = (member.name || '회원') + ' · 회원명단 전체 정보';
    var close = document.createElement('button');
    close.type = 'button'; close.textContent = '닫기'; close.style.cssText = 'padding:6px 12px;border:1px solid #cbd5e1;border-radius:6px;background:white';
    close.onclick = function () { modal.remove(); };
    heading.appendChild(title); heading.appendChild(close); panel.appendChild(heading);
    var list = document.createElement('dl');
    list.style.cssText = 'display:grid;grid-template-columns:minmax(140px,220px) 1fr;margin:0;padding:12px 22px 22px';
    entries.forEach(function (entry) {
      var dt = document.createElement('dt'); var dd = document.createElement('dd');
      dt.style.cssText = 'padding:10px 8px;color:#64748b;border-bottom:1px solid #f1f5f9';
      dd.style.cssText = 'padding:10px 8px;margin:0;color:#0f172a;border-bottom:1px solid #f1f5f9;word-break:break-word';
      dt.textContent = entry[0]; dd.textContent = entry[1] || '-'; list.appendChild(dt); list.appendChild(dd);
    });
    panel.appendChild(list); modal.appendChild(panel);
    modal.onclick = function (event) { if (event.target === modal) modal.remove(); };
    document.body.appendChild(modal);
  }
  setInterval(showMemberPhones, 500);
})();
</script>
<script>
/* 회비설정 간소화 · v40: 기본 20만원, 예외 기간만 관리 */
(function () {
  var STORAGE_KEY = 'mfm-fees-v2';
  var BASE_FEE = 200000;

  function readFees() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (error) { return []; }
  }
  function exceptionGroups() {
    var values = readFees().filter(function (item) { return Number(item.amount) !== BASE_FEE; }).sort(function (a, b) { return a.year - b.year; });
    var groups = [];
    values.forEach(function (item) {
      var last = groups[groups.length - 1];
      if (last && last.end + 1 === Number(item.year) && last.amount === Number(item.amount)) last.end = Number(item.year);
      else groups.push({ start: Number(item.year), end: Number(item.year), amount: Number(item.amount) });
    });
    return groups;
  }
  function saveGroups(groups) {
    var byYear = {};
    [2020, 2021, 2022].forEach(function (year) { byYear[year] = BASE_FEE; });
    groups.forEach(function (group) {
      for (var year = group.start; year <= group.end; year++) byYear[year] = group.amount;
    });
    var fees = Object.keys(byYear).map(function (year) { return { year: Number(year), amount: Number(byYear[year]) }; }).sort(function (a, b) { return a.year - b.year; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(fees));
    location.reload();
  }
  function field(label, value, name, width) {
    return '<label style="display:block;color:#475569;font-size:12px">' + label + '<input name="' + name + '" type="number" value="' + value + '" style="display:block;width:' + width + ';margin-top:5px;border:1px solid #cbd5e1;border-radius:7px;padding:8px 10px;font-size:14px"></label>';
  }
  function renderRows(box, groups) {
    var rows = box.querySelector('#simple-fee-rows');
    rows.innerHTML = groups.length ? groups.map(function (group, index) {
      return '<div style="display:grid;grid-template-columns:1fr 1fr 1.2fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid #eef2f7"><b>' + group.start + '년</b><b>' + group.end + '년</b><span>' + Number(group.amount).toLocaleString('ko-KR') + '원</span><button type="button" data-remove="' + index + '" style="border:0;background:transparent;color:#e11d48;padding:7px;cursor:pointer">삭제</button></div>';
    }).join('') : '<div style="padding:18px 0;color:#94a3b8">등록된 예외 기간이 없습니다.</div>';
  }
  function install() {
    var heading = Array.from(document.querySelectorAll('h3')).find(function (node) { return node.textContent.trim() === '연도별 회비'; });
    if (!heading) return;
    var box = heading.closest('.bg-white');
    if (!box || box.dataset.simpleFees === '1') return;
    box.dataset.simpleFees = '1';
    var groups = exceptionGroups();
    if (!groups.length) groups = [{ start: 2020, end: 2022, amount: 100000 }];
    box.innerHTML = '<h3 class="font-semibold mb-3">연도별 회비</h3>'
      + '<div style="padding:14px 16px;border-radius:9px;background:#eef2ff;color:#312e81;margin-bottom:20px">기본 회비 <b>200,000원</b> · 하반기 입회 첫 해는 자동 절반</div>'
      + '<div style="display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-bottom:18px">' + field('시작 연도', 2020, 'start', '105px') + field('종료 연도', 2022, 'end', '105px') + field('회비(원)', 100000, 'amount', '140px') + '<button id="simple-fee-add" type="button" style="border:0;background:#4f46e5;color:white;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer">예외 추가</button></div>'
      + '<div style="font-weight:600;margin-bottom:7px">예외 기간</div><div style="display:grid;grid-template-columns:1fr 1fr 1.2fr auto;gap:10px;color:#64748b;font-size:13px;padding:8px 0"><span>시작 연도</span><span>종료 연도</span><span>회비</span><span></span></div><div id="simple-fee-rows"></div>'
      + '<button id="simple-fee-save" type="button" style="margin-top:18px;border:0;background:#173f72;color:#fff;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer">설정 저장</button>';
    renderRows(box, groups);
    box.querySelector('#simple-fee-add').onclick = function () {
      var start = Number(box.querySelector('[name=start]').value), end = Number(box.querySelector('[name=end]').value), amount = Number(box.querySelector('[name=amount]').value);
      if (!start || !end || start > end || !amount) { alert('시작 연도, 종료 연도와 회비를 확인해 주세요.'); return; }
      groups = groups.filter(function (group) { return group.end < start || group.start > end; });
      groups.push({ start: start, end: end, amount: amount });
      groups.sort(function (a, b) { return a.start - b.start; });
      renderRows(box, groups);
    };
    box.querySelector('#simple-fee-rows').onclick = function (event) {
      var button = event.target.closest('[data-remove]');
      if (!button) return;
      groups.splice(Number(button.dataset.remove), 1);
      renderRows(box, groups);
    };
    box.querySelector('#simple-fee-save').onclick = function () { saveGroups(groups); };
  }
  setInterval(install, 500);
})();
</script>
</body>
