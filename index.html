<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>부천세무사회 회비관리</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a}
#v53-loading{padding:40px;text-align:center;font-size:15px;color:#64748b}
#v53-error{display:none;max-width:760px;margin:48px auto;padding:22px;border:1px solid #fecaca;border-radius:12px;background:#fff;color:#991b1b;line-height:1.7}
</style>
</head>
<body>
<div id="v53-loading">회비관리 프로그램을 불러오는 중입니다…</div>
<div id="v53-error"></div>
<script>
(function(){
  var BASE_COMMIT = "84c5b0de63964b0451b08de904ec00f986ed90c9";
  var urls = [
    'https://cdn.jsdelivr.net/gh/ctasun/bucheon-fee-manager@' + BASE_COMMIT + '/index.html',
    'https://raw.githubusercontent.com/ctasun/bucheon-fee-manager/' + BASE_COMMIT + '/index.html'
  ];
  var hotfix = "\n<script id=\"tx-classify-hotfix-v53\">\n/* v53 · 거래내역 '수정' 분류 변경 직접 저장 보정 */\n(function () {\n  var TX_KEY = 'mfm-tx-v2';\n\n  function readTx() {\n    try { return JSON.parse(localStorage.getItem(TX_KEY) || '[]'); }\n    catch (e) { return []; }\n  }\n  function norm(s) {\n    return String(s == null ? '' : s).replace(/\\s+/g, ' ').trim();\n  }\n  function money(s) {\n    var raw = String(s == null ? '' : s).replace(/,/g, '');\n    var m = raw.match(/-?\\d+/g);\n    return m ? Math.abs(Number(m.join(''))) : 0;\n  }\n  function rowIdentity(row) {\n    if (!row || !row.cells || row.cells.length < 5) return null;\n    var dt = norm(row.cells[0].textContent);\n    var dm = dt.match(/(\\d{4}-\\d{2}-\\d{2})(?:\\s+(\\d{1,2}:\\d{2}(?::\\d{2})?))?/);\n    if (!dm) return null;\n    return {\n      date: dm[1],\n      time: dm[2] || '',\n      name: norm(row.cells[1].textContent),\n      memo: norm(row.cells[2].textContent).replace(/^-$/, ''),\n      amount: money(row.cells[3].textContent),\n      desc: norm(row.cells[4].textContent).replace(/^-$/, '')\n    };\n  }\n  function findTxIndex(list, id) {\n    var exact = [];\n    for (var i = 0; i < list.length; i++) {\n      var t = list[i] || {};\n      if (String(t.date || '') !== id.date) continue;\n      if (Number(t.amount || 0) !== id.amount) continue;\n      if (norm(t.depositorName) !== id.name) continue;\n      if (id.time && norm(t.time) !== id.time) continue;\n      exact.push(i);\n    }\n    if (exact.length === 1) return exact[0];\n\n    var refined = exact.filter(function (i) {\n      var t = list[i] || {};\n      var memoOk = !id.memo || norm(t.transferMemo) === id.memo;\n      var descOk = !id.desc || norm(t.description) === id.desc;\n      return memoOk && descOk;\n    });\n    if (refined.length === 1) return refined[0];\n\n    var fallback = [];\n    for (var j = 0; j < list.length; j++) {\n      var x = list[j] || {};\n      if (String(x.date || '') === id.date &&\n          Number(x.amount || 0) === id.amount &&\n          norm(x.depositorName) === id.name) fallback.push(j);\n    }\n    return fallback.length === 1 ? fallback[0] : -1;\n  }\n  function classify(t, action) {\n    if (action === '회비로 인정') {\n      return Object.assign({}, t, {\n        direction: 'in',\n        category: t.memberId ? 'dues' : 'review',\n        manualAssign: true,\n        excluded: false,\n        matchPending: !t.memberId,\n        excludeReason: t.memberId ? '' : '회비 인정 전 회원 확인',\n        autoExcludeOverride: true\n      });\n    }\n    if (action === '찬조금으로 변경') {\n      return Object.assign({}, t, {\n        category: 'sponsorship',\n        manualAssign: true,\n        excluded: true,\n        matchPending: false,\n        excludeReason: '찬조금·회비 제외'\n      });\n    }\n    if (action === '정산반환으로 변경') {\n      return Object.assign({}, t, {\n        category: 'settlement',\n        manualAssign: true,\n        excluded: true,\n        matchPending: false,\n        excludeReason: '정산반환·회비 제외'\n      });\n    }\n    if (action === '기타제외로 변경') {\n      return Object.assign({}, t, {\n        memberId: null,\n        category: 'other',\n        manualAssign: true,\n        excluded: true,\n        matchPending: false,\n        excludeReason: '기타 회비 제외',\n        autoExcludeOverride: false\n      });\n    }\n    if (action === '확인필요로 표시') {\n      return Object.assign({}, t, {\n        category: 'review',\n        manualAssign: true,\n        excluded: false,\n        matchPending: true,\n        excludeReason: '관리자 확인필요'\n      });\n    }\n    return null;\n  }\n\n  document.addEventListener('click', function (event) {\n    var button = event.target && event.target.closest ? event.target.closest('.tx-action-menu button') : null;\n    if (!button) return;\n\n    var action = norm(button.textContent);\n    if (['회비로 인정','찬조금으로 변경','정산반환으로 변경','기타제외로 변경','확인필요로 표시'].indexOf(action) < 0) return;\n\n    var row = button.closest('tr');\n    var id = rowIdentity(row);\n    if (!id) return;\n\n    var list = readTx();\n    var idx = findTxIndex(list, id);\n    if (idx < 0) return;  // 유일하게 식별되지 않으면 기존 기능에 맡겨 오수정 방지\n\n    var changed = classify(list[idx], action);\n    if (!changed) return;\n\n    event.preventDefault();\n    event.stopPropagation();\n    if (event.stopImmediatePropagation) event.stopImmediatePropagation();\n\n    list[idx] = changed;\n    localStorage.setItem(TX_KEY, JSON.stringify(list));\n    location.reload();\n  }, true);\n})();\n<\/script>\n";

  function fetchBase(i) {
    if (i >= urls.length) return Promise.reject(new Error('v52 원본을 불러오지 못했습니다.'));
    return fetch(urls[i], {cache:'no-cache'}).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).catch(function() { return fetchBase(i + 1); });
  }

  fetchBase(0).then(function(src) {
    if (src.indexOf('부천세무사회 회비관리') < 0 || src.indexOf('mfm-tx-v2') < 0) {
      throw new Error('원본 파일 검증에 실패했습니다.');
    }
    src = src.replace(
      /<!-- BUILD_DATE:[\s\S]*?-->/,
      '<!-- BUILD_DATE: 2026-09-04 | v53 거래 분류 수정 저장 보정 · v52 전체 기능 유지 -->'
    );
    src = src.replace(
      /<div id="buildstamp" class="build-date">[\s\S]*?<\/div>/,
      '<div id="buildstamp" class="build-date">부천세무사회 회비관리 · v53 · 업데이트 2026-09-04</div>'
    );
    if (src.indexOf('</body>') >= 0) src = src.replace('</body>', hotfix + '\n</body>');
    else src += hotfix;

    document.open();
    document.write(src);
    document.close();
  }).catch(function(err) {
    var loading = document.getElementById('v53-loading');
    var box = document.getElementById('v53-error');
    if (loading) loading.style.display = 'none';
    if (box) {
      box.style.display = 'block';
      box.textContent = '프로그램 원본을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요. (' + err.message + ')';
    }
  });
})();
</script>
</body>
</html>
