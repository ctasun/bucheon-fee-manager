<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>부천세무사회 회비관리</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a}
#boot{padding:42px;text-align:center;color:#64748b;font-size:15px}
#error{display:none;max-width:820px;margin:48px auto;padding:22px;border:1px solid #fecaca;border-radius:12px;background:#fff;color:#991b1b;line-height:1.7}
</style>
</head>
<body>
<div id="boot">회비관리 프로그램을 확인하여 불러오는 중입니다…</div>
<div id="error"></div>
<script>
(function () {
  'use strict';

  var BASE_COMMIT = "84c5b0de63964b0451b08de904ec00f986ed90c9";
  var OLD_BRIDGE = "item.onclick=function (event) { event.preventDefault(); event.stopPropagation(); menu.hidden=true; originalButton.click(); };";
  var NEW_BRIDGE = "(function (originalLabel) {\n        item.onclick=function (event) {\n          event.preventDefault();\n          event.stopPropagation();\n          menu.hidden=true;\n          var liveOriginal = cell.querySelector(':scope > div:not(.tx-compact-ui)');\n          var liveButton = liveOriginal && Array.from(liveOriginal.querySelectorAll('button')).find(function (button) {\n            return button.textContent.trim() === originalLabel;\n          });\n          if (!liveButton) return;\n          liveButton.dispatchEvent(new MouseEvent('click', { bubbles:true, cancelable:true, view:window }));\n        };\n      })(originalButton.textContent.trim());";

  var OLD_STATUS_INFO = "    if (full.indexOf('찬조금') !== -1 && buttons.indexOf('회비로 인정') !== -1) { status='찬조금'; cls='tx-badge-sponsorship'; }\n    else if (full.indexOf('정산반환') !== -1 && buttons.indexOf('회비로 인정') !== -1) { status='정산반환'; cls='tx-badge-settlement'; }\n    else if (full.indexOf('비용집행') !== -1) { status='비용집행'; cls='tx-badge-expense'; }\n    else if (buttons.indexOf('회비로 인정') !== -1) { status='기타제외'; cls='tx-badge-other'; }";
  var NEW_STATUS_INFO = "    if (text.indexOf('찬조금') !== -1 && buttons.indexOf('회비로 인정') !== -1) { status='찬조금'; cls='tx-badge-sponsorship'; }\n    else if (text.indexOf('정산반환') !== -1 && buttons.indexOf('회비로 인정') !== -1) { status='정산반환'; cls='tx-badge-settlement'; }\n    else if (text.indexOf('비용집행') !== -1) { status='비용집행'; cls='tx-badge-expense'; }\n    else if (buttons.indexOf('회비로 인정') !== -1) { status='기타제외'; cls='tx-badge-other'; }";

  var urls = [
    'https://cdn.jsdelivr.net/gh/ctasun/bucheon-fee-manager@' + BASE_COMMIT + '/index.html',
    'https://raw.githubusercontent.com/ctasun/bucheon-fee-manager/' + BASE_COMMIT + '/index.html'
  ];

  function countOf(source, target) {
    return source.split(target).length - 1;
  }

  function getBase(index) {
    if (index >= urls.length) {
      return Promise.reject(new Error('검증된 v52 원본을 불러오지 못했습니다.'));
    }
    return fetch(urls[index], { cache: 'no-store' }).then(function (response) {
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.text();
    }).catch(function () {
      return getBase(index + 1);
    });
  }

  function fail(message) {
    var boot = document.getElementById('boot');
    var box = document.getElementById('error');
    if (boot) boot.style.display = 'none';
    if (box) {
      box.style.display = 'block';
      box.textContent = message;
    }
  }

  getBase(0).then(function (source) {
    // v52 완전본인지 먼저 검증. 불일치하면 절대로 실행하지 않는다.
    var required = [
      '<div id="root"></div>',
      'mfm-members-v2',
      'mfm-tx-v2',
      'mfm-fees-v2',
      'mfm-config-v2',
      'tx-compact-actions-v45',
      'both-io-members-v50',
      'fee-trace-v49'
    ];
    for (var i = 0; i < required.length; i++) {
      if (source.indexOf(required[i]) < 0) {
        throw new Error('v52 원본 검증 실패: ' + required[i]);
      }
    }

    // 문제 지점 1곳만 교체한다.
    var bridgeCount = countOf(source, OLD_BRIDGE);
    if (bridgeCount !== 1) {
      throw new Error('거래 수정 연결부 검증 실패: 대상 ' + bridgeCount + '곳');
    }
    source = source.replace(OLD_BRIDGE, NEW_BRIDGE);

    // v53.3: 거래 상태 표시는 숨겨진 작업버튼 문구가 아니라 실제 상태 문구(text)로 판정한다.
    // 기존 full에는 '찬조금' 버튼명이 항상 포함되어 기타제외도 찬조금으로 보이는 오류가 있었다.
    var statusCount = countOf(source, OLD_STATUS_INFO);
    if (statusCount !== 1) {
      throw new Error('거래 상태 표시부 검증 실패: 대상 ' + statusCount + '곳');
    }
    source = source.replace(OLD_STATUS_INFO, NEW_STATUS_INFO);

    // 버전 표기만 변경. 프로그램 본체/데이터 구조는 변경하지 않는다.
    source = source.replace(
      '<!-- BUILD_DATE: 2026-09-04 23:10 KST | v52 매칭/연결 제목 겹침 수정 · 2021년 이후 미납 전입회원 회비규칙 안내 · v51 기능 유지 -->',
      '<!-- BUILD_DATE: 2026-09-04 | v53.3 거래분류 표시판정 수정 · 거래내역 수정 연결 유지 · v52 전체 기능 유지 -->'
    );
    source = source.replace(
      '<div id="buildstamp" class="build-date">부천세무사회 회비관리 · v52 · 업데이트 2026-09-04</div>',
      '<div id="buildstamp" class="build-date">부천세무사회 회비관리 · v53.3 · 업데이트 2026-09-04</div>'
    );

    // 재검증: 이전 브리지/직접 재로딩이 남지 않았는지 확인.
    if (source.indexOf(OLD_BRIDGE) >= 0) throw new Error('이전 거래 수정 연결부가 남아 있습니다.');
    if (source.indexOf(NEW_BRIDGE) < 0) throw new Error('새 거래 수정 연결부 적용에 실패했습니다.');
    if (source.indexOf(OLD_STATUS_INFO) >= 0) throw new Error('이전 거래 상태 표시판정이 남아 있습니다.');
    if (source.indexOf(NEW_STATUS_INFO) < 0) throw new Error('새 거래 상태 표시판정 적용에 실패했습니다.');

    // 외부 hotfix/localStorage 직접 수정 없이 v52 React 상태 변경 함수를 그대로 실행한다.
    document.open();
    document.write(source);
    document.close();
  }).catch(function (error) {
    fail('프로그램 안전검증 중 중단되었습니다. 파일을 그대로 두고 관리자에게 알려주세요. (' + error.message + ')');
  });
})();
</script>
</body>
</html>
