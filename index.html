<script>
/* 회원명단 연락처 반영 + 회원조회용 최소자료 전송 · v33 */
(function () {
  var MEMBER_KEY = 'mfm-members-v2';
  var TX_KEY = 'mfm-tx-v2';
  var FEE_KEY = 'mfm-fees-v2';
  var UPLOAD_KEY = 'mfm-upload-v2';
  var pendingRoster = null;
  var PRESET_DEPOSITOR_ALIASES = {
    '이창숙': ['세무법인비펌'],
    '김복곤': ['세무법인성산부천2지점'],
    '박인수': ['드림세무법인부천지점'],
    '심기태': ['세무법인성산부천1지점'],
    '안병선': ['세무법인성산부천3지점', '세무법인성산부천3지'],
    '이영석': ['세무법인세담'],
    '김용삼': ['세무법인스타택스'],
    '정귀수': ['세무법인중산4지점'],
    '황만순': ['세무법인택스원 부천'],
    '박재정': ['세무법인하누리부천제4지점'],
    '노승안': ['세무법인화인부천지점'],
    '신기철': ['정안세무법인', '정안세무법인(신기철'],
    '박승진': ['청록세무법인(부천)'],
    '이기진': ['하늘세무법인부천'],
    '홍정표': ['현대세무법인']
  };

  function digits(value) {
    return String(value == null ? '' : value).replace(/[^0-9]/g, '');
  }

  function readJson(key, fallback) {
    try {
      var value = localStorage.getItem(key);
      return value ? JSON.parse(value) : fallback;
    } catch (e) {
      return fallback;
    }
  }

  function mergePresetDepositorAliases(members) {
    var changed = 0;
    var mergedMembers = (members || []).map(function (member) {
      var presets = PRESET_DEPOSITOR_ALIASES[String(member.name || '').trim()];
      if (!presets || !presets.length) return member;
      var aliases = Array.isArray(member.aliases) ? member.aliases.slice() : [];
      presets.forEach(function (alias) {
        if (aliases.indexOf(alias) === -1) aliases.push(alias);
      });
      if (aliases.length === (Array.isArray(member.aliases) ? member.aliases.length : 0)) return member;
      changed++;
      return Object.assign({}, member, { aliases: aliases });
    });
    return { members: mergedMembers, changed: changed };
  }

  function isCurrentMember(member) {
    if (!member.leaveDate) return true;
    var leave = new Date(member.leaveDate);
    return isNaN(leave.getTime()) || leave > new Date();
  }

  function yearOf(value) {
    return value ? new Date(value).getFullYear() : new Date().getFullYear();
  }

  function monthOf(value) {
    return value ? new Date(value).getMonth() + 1 : 1;
  }

  function defaultFee(year) {
    return year >= 2020 && year <= 2022 ? 100000 : 200000;
  }

  function feeForYear(year, fees) {
    var fee = (fees || []).find(function (item) { return Number(item.year) === year; });
    return fee ? Number(fee.amount || 0) : defaultFee(year);
  }

  function requiredFor(member, year, fees) {
    var base = feeForYear(year, fees);
    if (!base || year <= 2020 || year > new Date().getFullYear()) return 0;
    var joinYear = yearOf(member.joinDate);
    if (member.joinDate && year < joinYear) return 0;
    if (member.leaveDate && year > yearOf(member.leaveDate)) return 0;
    if (member.joinDate && year === joinYear && monthOf(member.joinDate) >= 7) return Math.round(base / 2);
    return base;
  }

  function allocateForLookup(member, memberTransactions, fees, upTo) {
    var startYear = Math.max(yearOf(member.joinDate), 2011);
    var endYear = member.leaveDate ? Math.min(upTo, yearOf(member.leaveDate) - 1) : upTo;
    var years = [];
    var prior = Number(member.priorArrears || 0);
    if (prior > 0) years.push({ year: 'prior', label: '2020년까지 이월', required: prior, allocated: 0, payments: [], isPrior: true });
    for (var year = startYear; year <= endYear; year++) {
      var required = requiredFor(member, year, fees);
      if (required > 0) years.push({ year: year, label: year + '년도', required: required, allocated: 0, payments: [], isPrior: false });
    }
    var sorted = memberTransactions.slice().sort(function (a, b) {
      return (String(a.date || '') + ' ' + String(a.time || '')).localeCompare(String(b.date || '') + ' ' + String(b.time || ''));
    });
    sorted.forEach(function (transaction) {
      var remaining = Number(transaction.amount || 0);
      years.forEach(function (item) {
        if (remaining <= 0 || item.allocated >= item.required) return;
        var applied = Math.min(remaining, item.required - item.allocated);
        item.allocated += applied;
        item.payments.push({
          txId: transaction.id,
          date: String(transaction.date || ''),
          time: String(transaction.time || ''),
          depositorName: String(transaction.depositorName || ''),
          fullAmount: Number(transaction.amount || 0),
          appliedAmount: applied
        });
        remaining -= applied;
      });
    });
    return years.map(function (item) {
      var remaining = Math.max(0, item.required - item.allocated);
      return {
        year: item.year,
        label: item.label,
        required: item.required,
        allocated: Math.min(item.required, item.allocated),
        remaining: remaining,
        status: remaining <= 0 ? 'paid' : item.allocated > 0 ? 'partial' : 'unpaid',
        payments: item.payments
      };
    });
  }

  function makeLookupData() {
    var members = readJson(MEMBER_KEY, []);
    var transactions = readJson(TX_KEY, []);
    var fees = readJson(FEE_KEY, []);
    var uploadMeta = readJson(UPLOAD_KEY, null) || {};
    var maxFeeYear = (fees || []).reduce(function (max, fee) { return Math.max(max, Number(fee.year || 0)); }, 0);
    var upTo = Math.max(new Date().getFullYear(), maxFeeYear, 2011);
    return {
      version: 2,
      generatedAt: new Date().toISOString(),
      bankLastTransactionAt: String(uploadMeta.maxDate || ''),
      bankFileUploadedAt: String(uploadMeta.uploadedAt || ''),
      members: members.filter(isCurrentMember).map(function (member) {
        var phoneDigits = digits(member.phone);
        var memberTransactions = transactions.filter(function (tx) { return tx.memberId === member.id && !tx.excluded && !tx.matchPending && tx.direction !== 'out' && (!tx.category || tx.category === 'dues'); });
        var years = allocateForLookup(member, memberTransactions, fees, upTo);
        return {
          regNo: String(member.regNo || '').trim(),
          phoneLast4: phoneDigits.length >= 4 ? phoneDigits.slice(-4) : '',
          name: String(member.name || '').trim(),
          totalArrears: years.reduce(function (sum, item) { return sum + Number(item.remaining || 0); }, 0),
          years: years,
          payments: memberTransactions.map(function (tx) {
              return {
                date: String(tx.date || ''),
                time: String(tx.time || ''),
                amount: Number(tx.amount || 0),
                depositorName: String(tx.depositorName || '')
              };
            })
            .sort(function (a, b) {
              return (a.date + ' ' + a.time).localeCompare(b.date + ' ' + b.time);
            })
        };
      }).filter(function (member) {
        return member.regNo && member.phoneLast4;
      })
    };
  }

  function formatAdminDateTime(value) {
    if (!value) return '기록 없음';
    var source = String(value);
    var year, month, day, hour, minute;
    if (/T|Z|[+-]\d\d:\d\d$/.test(source)) {
      var date = new Date(source);
      if (isNaN(date.getTime())) return source;
      year = date.getFullYear(); month = date.getMonth() + 1; day = date.getDate();
      hour = date.getHours(); minute = date.getMinutes();
    } else {
      var text = source.replace('T', ' ').slice(0, 19);
      var match = text.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
      if (!match) return text;
      year = Number(match[1]); month = Number(match[2]); day = Number(match[3]);
      hour = Number(match[4]); minute = Number(match[5]);
    }
    var ampm = hour < 12 ? '오전' : '오후';
    var displayHour = hour % 12 || 12;
    return year + '. ' + month + '. ' + day + '. ' + ampm + ' ' + displayHour + '시' + (minute ? ' ' + minute + '분' : '');
  }

  function applyBankTimeLabels() {
    var uploadMeta = readJson(UPLOAD_KEY, null) || {};
    var spans = document.querySelectorAll('span');
    for (var index = 0; index < spans.length; index++) {
      var labelText = spans[index].textContent || '';
      if (labelText.indexOf('통장 자료 최종일시:') === -1
        && labelText.indexOf('통장파일 업로드 ·') === -1) continue;
      spans[index].innerHTML = '🏦 통장파일 업로드 · <b class="text-gray-800">' + formatAdminDateTime(uploadMeta.uploadedAt) + '</b>'
        + ' <span class="text-gray-400">　통장 마지막 거래 · <b class="text-gray-800">' + formatAdminDateTime(uploadMeta.maxDate) + '</b></span>';
    }
  }

  var originalFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    if (init && String(init.method || '').toUpperCase() === 'POST' && typeof init.body === 'string') {
      try {
        var body = JSON.parse(init.body);
        if (body && body.xlsxBase64 && Object.prototype.hasOwnProperty.call(body, 'token')) {
          body.lookupData = makeLookupData();
          init = Object.assign({}, init, { body: JSON.stringify(body) });
        }
      } catch (e) {}
    }
    return originalFetch(input, init);
  };

  async function parseRosterContacts(file) {
    if (!window.XLSX || !file) return null;
    var workbook = XLSX.read(await file.arrayBuffer(), { cellDates: true });
    var data = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: '' });
    var headerIndex = -1;
    for (var i = 0; i < Math.min(data.length, 15); i++) {
      var headerText = (data[i] || []).map(String).join(' ');
      if ((headerText.indexOf('성명') !== -1 || headerText.indexOf('이름') !== -1) && headerText.indexOf('등록번호') !== -1) {
        headerIndex = i;
        break;
      }
    }
    if (headerIndex < 0) return null;
    var columnCount = Math.max.apply(null, data.slice(Math.max(0, headerIndex - 2), headerIndex + 1).map(function (row) { return (row || []).length; }));
    var headers = [];
    for (var headerColumn = 0; headerColumn < columnCount; headerColumn++) {
      var parts = [];
      for (var headerRow = Math.max(0, headerIndex - 2); headerRow <= headerIndex; headerRow++) {
        var part = String((data[headerRow] || [])[headerColumn] || '').trim();
        if (part && parts.indexOf(part) === -1) parts.push(part);
      }
      headers.push(parts.join(' '));
    }
    function columns(keys) {
      var found = [];
      headers.forEach(function (header, index) {
        if (keys.some(function (key) { return header.indexOf(key) !== -1; })) found.push(index);
      });

  function exceptionGroups() {

      var last = groups[groups.length - 1];
      if (last && last.end + 1 === Number(item.year) && last.amount === Number(item.amount)) last.end = Number(item.year);

    });

      var hasReg=heads.some(function(head){return head==='등록번호';});
      var hasName=heads.some(function(head){return head==='성명'||head==='회원';});
      var isMemberList=heads.some(function(head){return head.indexOf('미납합계')!==-1||head.indexOf('입금자명/별칭')!==-1||head.indexOf('미납 연도')!==-1||head.indexOf('탈회')!==-1||head==='상태';});
      return hasReg&&hasName&&isMemberList;
    });
  }
  function decorate(){
    var current=getState();
    memberTables().forEach(function(table){
      var heads=Array.from(table.querySelectorAll('thead th')).map(text),regIndex=heads.indexOf('등록번호');
      var nameIndex=heads.indexOf('성명');if(nameIndex<0)nameIndex=heads.indexOf('회원');
      Array.from(table.querySelectorAll('tbody tr')).forEach(function(row){
        var cells=row.children;if(!cells||regIndex<0||nameIndex<0||!cells[regIndex]||!cells[nameIndex])return;
        var reg=text(cells[regIndex]),nameButton=cells[nameIndex].querySelector('button'),name=text(nameButton||cells[nameIndex]).replace(/탈회\s*\d{4}[-.\/]\d{1,2}[-.\/]\d{1,2}.*/,'').trim();
        var memberId=current.byReg[reg]||current.byName[name],isBoth=!!(memberId&&current.both[memberId]);
        row.dataset.cfmBothIo=isBoth?'1':'0';
        var target=nameButton||cells[nameIndex];target.classList.toggle('cfm-both-io-name',isBoth);
        row.classList.toggle('cfm-both-io-hidden',active&&!isBoth);
      });
    });
    var button=document.getElementById('cfm-both-io-filter');
    if(button){button.dataset.active=active?'1':'0';button.innerHTML='<span aria-hidden="true">↕</span> 입·출금 회원 '+current.count+'명'+(active?'만 보기':'');}
  }
  function installButton(){
    if(document.getElementById('cfm-both-io-filter'))return;
    var nav=Array.from(document.querySelectorAll('div')).find(function(element){
      var cls=String(element.className||''),label=text(element);
      return cls.indexOf('overflow-x-auto')!==-1&&label.indexOf('납입현황')!==-1&&label.indexOf('탈회회원')!==-1;
    });
    if(!nav)return;
    var button=document.createElement('button');button.id='cfm-both-io-filter';button.type='button';button.dataset.active='0';
    button.className='flex items-center gap-2 px-4 py-2.5 text-sm font-medium border-b-2 whitespace-nowrap border-transparent text-gray-600 hover:text-gray-900';
    button.onclick=function(event){event.preventDefault();event.stopPropagation();active=!active;decorate();};
    nav.appendChild(button);
  }
  function refresh(){
    installButton();
    var source=String(localStorage.getItem(MK)||'')+'|'+String(localStorage.getItem(TK)||''),hash=0;
    for(var i=0;i<source.length;i++)hash=((hash<<5)-hash+source.charCodeAt(i))|0;
    var signature=hash+'|'+document.querySelectorAll('tbody tr').length+'|'+active;
    if(signature!==lastSignature||!document.querySelector('.cfm-both-io-name')){lastSignature=signature;decorate();}
  }
  setInterval(refresh,600);refresh();
  window.addEventListener('storage',refresh);
})();
</script>
</body>
</html>
